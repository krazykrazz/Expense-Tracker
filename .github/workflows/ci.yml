name: CI

on:
  # Documentation-only pushes to main don't run CI (no tests, no image). Keep this list in sync with the
  # `code` filter in the path-filter job below.
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - '.github/instructions/**'
      - '.github/skills/**'
  # Pull requests always run: main requires Backend/Frontend Tests Status, and a workflow skipped by
  # paths-ignore would leave them pending forever. A docs-only PR skips the test jobs instead (path-filter).
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      health_check_timeout:
        description: 'Health check HTTP timeout in seconds'
        required: false
        default: '30'
        type: string
      health_check_retries:
        description: 'Number of health check retry attempts'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  path-filter:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
      empty_pr: ${{ steps.empty_check.outputs.empty_pr }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Evaluate path filters
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            shared:
              - 'scripts/**'
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
              - '.dockerignore'
              - 'package.json'
              - 'package-lock.json'

      # Anything that isn't documentation. A separate step because `every` applies to all of a step's
      # filters: a file counts only if it matches '**' and none of the documentation patterns.
      - name: Detect non-documentation changes
        uses: dorny/paths-filter@v4
        id: code_filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!specs/**'
              - '!.github/instructions/**'
              - '!.github/skills/**'

      - name: Generate filtering summary
        run: |
          {
            echo "## Path-Based Test Filtering"
            echo ""
            echo "| Component | Changed | Tests Will Run |"
            echo "|-----------|---------|----------------|"
            echo "| Backend | ${{ steps.filter.outputs.backend }} | ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.shared == 'true' }} |"
            echo "| Frontend | ${{ steps.filter.outputs.frontend }} | ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.shared == 'true' }} |"
            echo "| Shared Infrastructure | ${{ steps.filter.outputs.shared }} | N/A |"
            echo ""

            if [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
              echo "⚠️ **Shared infrastructure changed - running all tests**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # empty_pr (kept as the output name): something other than documentation changed, but it isn't backend,
      # frontend or shared infrastructure (e.g. an unrecognised config file). Run every test to be safe.
      # Documentation-only changes run nothing; the status jobs then report the tests as skipped (passed).
      - name: Check for unclassified changes
        id: empty_check
        run: |
          if [ "${{ steps.code_filter.outputs.code }}" = "false" ]; then
            echo "empty_pr=false" >> "$GITHUB_OUTPUT"
            echo "📝 **Documentation-only change - tests skipped**" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.filter.outputs.backend }}" = "false" ] && \
             [ "${{ steps.filter.outputs.frontend }}" = "false" ] && \
             [ "${{ steps.filter.outputs.shared }}" = "false" ]; then
            echo "empty_pr=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ **Changes outside backend/frontend/shared detected - will run all tests**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "empty_pr=false" >> "$GITHUB_OUTPUT"
          fi

  lockfile-integrity:
    name: Lockfile Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Guards against committed lockfiles drifting from package.json — e.g.
      # cross-platform optional deps (@emnapi/*) get pruned when npm runs on
      # Windows, producing a lockfile that `npm ci` rejects. Without this,
      # such drift only surfaces in the release workflow's `npm ci` build.
      - name: Verify lockfiles are npm ci-installable
        run: |
          set -e
          for dir in . backend frontend; do
            echo "::group::npm ci ($dir)"
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
            echo "::endgroup::"
          done

  workflow-validation:
    name: Workflow Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 \
            -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint -- --max-warnings=587

  backend-unit-tests:
    name: Backend Unit Tests ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: path-filter
    if: |
      needs.path-filter.outputs.backend == 'true' ||
      needs.path-filter.outputs.shared == 'true' ||
      needs.path-filter.outputs.empty_pr == 'true' ||
      needs.path-filter.result == 'failure'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test CI enforcement scripts
        if: matrix.shard == '1/2'
        run: |
          mkdir -p test-results
          npx jest --config ../scripts/jest.config.js \
            --json --outputFile=test-results/ci-enforcement.json

      - name: Record test start time
        id: test_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          mkdir -p test-results
          npx cross-env NODE_ENV=test CI=true jest \
            --testPathIgnorePatterns=pbt \
            --testPathIgnorePatterns="backup.*(integration|pbt)" \
            --shard=${{ matrix.shard }} \
            --json --outputFile=test-results/backend-unit-${{ strategy.job-index }}.json
        env:
          CI: true

      - name: Upload backend unit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-${{ strategy.job-index }}-test-results
          path: backend/test-results/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Check runtime budget
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${{ steps.test_start.outputs.start }} ))
          node ../scripts/check-test-budget.js backend-unit-tests $ELAPSED
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

  backend-pbt-shards:
    name: Backend PBT Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: path-filter
    if: |
      needs.path-filter.outputs.backend == 'true' ||
      needs.path-filter.outputs.shared == 'true' ||
      needs.path-filter.outputs.empty_pr == 'true' ||
      needs.path-filter.result == 'failure'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Record PBT start time
        id: pbt_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run PBT tests (shard ${{ matrix.shard }})
        run: |
          mkdir -p test-results
          npx cross-env NODE_ENV=test CI=true FAST_CHECK_NUM_RUNS=15 jest \
            --testPathPatterns=pbt \
            --testPathIgnorePatterns="backup" \
            --shard=${{ matrix.shard }} \
            --json --outputFile=test-results/backend-pbt-${{ strategy.job-index }}.json

      - name: Run backup tests (serial, shard 1 only)
        if: matrix.shard == '1/3'
        run: npm run test:backup:ci -- --json --outputFile=test-results/backend-backup.json

      - name: Validate PBT guardrails (shard 1 only)
        if: matrix.shard == '1/3'
        run: node ../scripts/validate-pbt-guardrails.js

      - name: Upload backend PBT results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-pbt-${{ strategy.job-index }}-test-results
          path: backend/test-results/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Check runtime budget
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${{ steps.pbt_start.outputs.start }} ))
          node ../scripts/check-test-budget.js backend-pbt-shard $ELAPSED
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

  backend-pbt-tests:
    name: Backend PBT Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [path-filter, backend-pbt-shards]
    if: |
      always() && (
        needs.path-filter.outputs.backend == 'true' ||
        needs.path-filter.outputs.shared == 'true' ||
        needs.path-filter.outputs.empty_pr == 'true' ||
        needs.path-filter.result == 'failure'
      )
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.backend-pbt-shards.result }}" != "success" ]; then
            echo "PBT shards failed or were cancelled"
            exit 1
          fi
          echo "All PBT shards passed"

  backend-tests-status:
    name: Backend Tests Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [path-filter, backend-unit-tests, backend-pbt-tests, lint, workflow-validation, lockfile-integrity, security-audit]
    steps:
      - name: Check backend test results
        run: |
          BACKEND_NEEDED="${{ needs.path-filter.outputs.backend == 'true' || needs.path-filter.outputs.shared == 'true' || needs.path-filter.outputs.empty_pr == 'true' || needs.path-filter.result == 'failure' }}"

          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "ESLint failed"
            exit 1
          fi
          if [ "${{ needs.workflow-validation.result }}" != "success" ]; then
            echo "Workflow validation failed"
            exit 1
          fi
          if [ "${{ needs.lockfile-integrity.result }}" != "success" ]; then
            echo "Lockfile integrity failed"
            exit 1
          fi
          if [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "Security audit failed"
            exit 1
          fi

          if [ "$BACKEND_NEEDED" = "true" ]; then
            # Tests ran - check if they passed
            if [ "${{ needs.backend-unit-tests.result }}" != "success" ] || \
               [ "${{ needs.backend-pbt-tests.result }}" != "success" ]; then
              echo "Backend tests failed"
              exit 1
            fi
            echo "Backend tests passed"
          else
            # Tests skipped - report as passed
            echo "Backend tests skipped (no relevant changes)"
          fi

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: path-filter
    if: |
      needs.path-filter.outputs.frontend == 'true' ||
      needs.path-filter.outputs.shared == 'true' ||
      needs.path-filter.outputs.empty_pr == 'true' ||
      needs.path-filter.result == 'failure'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate no raw fetch() calls
        run: node ../scripts/validate-no-raw-fetch.js

      - name: Record test start time
        id: test_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          mkdir -p test-results
          npx vitest --run --exclude '**/App.performance.test.jsx' \
            --reporter=default --reporter=json \
            --outputFile.json=test-results/frontend.json

      - name: Upload frontend results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: frontend/test-results/frontend.json
          if-no-files-found: warn
          retention-days: 30

      - name: Check runtime budget
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${{ steps.test_start.outputs.start }} ))
          node ../scripts/check-test-budget.js frontend-tests $ELAPSED
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: path-filter
    if: |
      needs.path-filter.outputs.frontend == 'true' ||
      needs.path-filter.outputs.shared == 'true' ||
      needs.path-filter.outputs.empty_pr == 'true' ||
      needs.path-filter.result == 'failure'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build frontend
        run: npm run build

  docker-build-smoke:
    name: Docker Build Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: path-filter
    if: |
      github.event_name == 'pull_request' &&
      (
        needs.path-filter.outputs.backend == 'true' ||
        needs.path-filter.outputs.frontend == 'true' ||
        needs.path-filter.outputs.shared == 'true' ||
        needs.path-filter.outputs.empty_pr == 'true' ||
        needs.path-filter.result == 'failure'
      )
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: expense-tracker:ci-smoke
          cache-from: type=gha,scope=docker-smoke
          cache-to: type=gha,mode=max,scope=docker-smoke

  frontend-tests-status:
    name: Frontend Tests Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [path-filter, frontend-tests, frontend-build, docker-build-smoke]
    steps:
      - name: Check frontend test results
        run: |
          FRONTEND_NEEDED="${{ needs.path-filter.outputs.frontend == 'true' || needs.path-filter.outputs.shared == 'true' || needs.path-filter.outputs.empty_pr == 'true' || needs.path-filter.result == 'failure' }}"
          DOCKER_NEEDED="${{ github.event_name == 'pull_request' && (needs.path-filter.outputs.backend == 'true' || needs.path-filter.outputs.frontend == 'true' || needs.path-filter.outputs.shared == 'true' || needs.path-filter.outputs.empty_pr == 'true' || needs.path-filter.result == 'failure') }}"

          if [ "$FRONTEND_NEEDED" = "true" ] && [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "Frontend production build failed"
            exit 1
          fi
          if [ "$DOCKER_NEEDED" = "true" ] && [ "${{ needs.docker-build-smoke.result }}" != "success" ]; then
            echo "Docker build smoke test failed"
            exit 1
          fi

          if [ "$FRONTEND_NEEDED" = "true" ]; then
            # Tests ran - check if they passed
            if [ "${{ needs.frontend-tests.result }}" != "success" ]; then
              echo "Frontend tests failed"
              exit 1
            fi
            echo "Frontend tests passed"
          else
            # Tests skipped - report as passed
            echo "Frontend tests skipped (no relevant changes)"
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend

      - name: Run backend security audit
        id: backend_audit
        run: |
          BACKEND_STATUS=pass
          {
            echo "## Security Audit Results"
            echo ""
            echo "### Backend Dependencies"
            echo ""
            if npm audit --audit-level=high 2>&1 | tee audit-output.txt; then
              echo "✅ No high or critical vulnerabilities found"
            else
              BACKEND_STATUS=fail
              echo "❌ High or critical vulnerabilities detected:"
              echo '```'
              cat audit-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "backend_status=$BACKEND_STATUS" >> "$GITHUB_OUTPUT"
        working-directory: backend
        continue-on-error: true

      - name: Run frontend security audit
        id: frontend_audit
        run: |
          FRONTEND_STATUS=pass
          {
            echo "### Frontend Dependencies"
            echo ""
            if npm audit --audit-level=high 2>&1 | tee audit-output.txt; then
              echo "✅ No high or critical vulnerabilities found"
            else
              FRONTEND_STATUS=fail
              echo "❌ High or critical vulnerabilities detected:"
              echo '```'
              cat audit-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "frontend_status=$FRONTEND_STATUS" >> "$GITHUB_OUTPUT"
        working-directory: frontend
        continue-on-error: true

      - name: Fail on high or critical vulnerabilities
        if: steps.backend_audit.outputs.backend_status == 'fail' || steps.frontend_audit.outputs.frontend_status == 'fail'
        run: |
          echo "::error::Security audit found high or critical vulnerabilities"
          exit 1

  test-health-report:
    name: Test Health Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [backend-unit-tests, backend-pbt-tests, frontend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download test result artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: '*-test-results'
          path: test-results
          merge-multiple: true

      - name: Report test health
        run: |
          shopt -s nullglob
          results=(test-results/*.json)
          if [ ${#results[@]} -eq 0 ]; then
            node scripts/report-test-health.js >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/report-test-health.js --results "${results[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GITHUB_ACTIONS: true

  build-and-push-ghcr:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [backend-tests-status, frontend-tests-status, lockfile-integrity, security-audit]
    # Deploy jobs keep the dependabot guard: their GITHUB_TOKEN is read-only on
    # dependabot events, so a run here could only fail. Test jobs need no write scope.
    # `!cancelled()` is required: without a status function GitHub applies an implicit
    # success() that skips this job whenever any upstream test job was skipped by the
    # path filter (e.g. backend tests on a frontend-only merge), even though both
    # status aggregators passed.
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/main' && 
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.backend-tests-status.result == 'success' &&
      needs.frontend-tests-status.result == 'success' &&
      needs.lockfile-integrity.result == 'success' &&
      needs.security-audit.result == 'success'
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        run: |
          {
            echo "sha_short=$(git rev-parse --short=7 HEAD)"
            echo "version=$(jq -r .version backend/package.json)"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"
      
      - name: Build and load Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/expense-tracker:${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/expense-tracker:v${{ steps.meta.outputs.version }}
          build-args: |
            IMAGE_TAG=${{ steps.meta.outputs.sha_short }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            GIT_COMMIT=${{ steps.meta.outputs.sha_short }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha_short }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=expense-tracker
            org.opencontainers.image.description=Personal expense tracking application
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        id: trivy
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/expense-tracker:${{ steps.meta.outputs.sha_short }}
          TRIVY_VERSION: '0.57.1'
        run: |
          set -euo pipefail

          # Trivy exits 1 both for "found vulnerabilities" and for "failed to start", so the
          # scan itself runs with --exit-code 0 and the gate is applied to the JSON below.
          # That keeps a DB-download outage from masquerading as a CRITICAL finding.
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/work" -w /work \
              -v trivy-cache:/root/.cache/trivy \
              "aquasec/trivy:${TRIVY_VERSION}" image \
              --db-repository "$1" \
              --format json \
              --output trivy-results.json \
              --exit-code 0 \
              --severity CRITICAL,HIGH,MEDIUM,LOW \
              --vuln-type os,library \
              "$IMAGE"
          }

          DB_REPOS=(
            "ghcr.io/aquasecurity/trivy-db:2"
            "mirror.gcr.io/aquasec/trivy-db:2"
          )
          scanned=false
          for attempt in 1 2 3; do
            for repo in "${DB_REPOS[@]}"; do
              if scan "$repo"; then
                scanned=true
                break
              fi
              echo "Trivy run failed using DB repository ${repo} (attempt ${attempt}/3)"
            done
            if [ "$scanned" = true ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $(( attempt * 15 ))
            fi
          done

          if [ "$scanned" != true ]; then
            echo "::error::Trivy could not complete the scan after 3 attempts against 2 DB mirrors. This is a scanner infrastructure failure, NOT a vulnerability finding - the image was not assessed."
            exit 1
          fi

          docker run --rm -v "$PWD:/work" -w /work \
            "aquasec/trivy:${TRIVY_VERSION}" convert \
            --format table --output trivy-results.txt trivy-results.json

          if ! jq empty trivy-results.json >/dev/null 2>&1; then
            echo "::error::Trivy produced invalid JSON"
            exit 1
          fi

          {
            for sev in CRITICAL HIGH MEDIUM LOW; do
              count=$(jq --arg s "$sev" \
                '[.Results[]?.Vulnerabilities[]? | select(.Severity == $s)] | length' \
                trivy-results.json)
              key=$(printf '%s' "$sev" | tr '[:upper:]' '[:lower:]')
              echo "${key}=$count"
              echo "${sev}: ${count}"
            done
          } >> "$GITHUB_OUTPUT"

          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::Trivy found ${CRITICAL} CRITICAL and ${HIGH} HIGH vulnerabilities in the image"
            exit 1
          fi

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            -v trivy-cache:/root/.cache/trivy \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --skip-db-update \
            --format cyclonedx \
            --output trivy-sbom.cdx.json \
            --exit-code 0 \
            "$IMAGE"

          if ! jq empty trivy-sbom.cdx.json >/dev/null 2>&1; then
            echo "::error::Trivy failed to generate a valid CycloneDX SBOM"
            exit 1
          fi

      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-scan-${{ steps.meta.outputs.sha_short }}
          path: |
            trivy-results.txt
            trivy-results.json
            trivy-sbom.cdx.json
          retention-days: 30

      - name: Write Trivy summary
        if: always()
        run: |
          {
            echo "## Docker Image Vulnerability Scan"
            echo ""
            echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/expense-tracker:${{ steps.meta.outputs.sha_short }}\`"
            echo ""
            if [ -f trivy-results.json ]; then
              echo "| Severity | Count |"
              echo "|----------|-------|"
              for sev in CRITICAL HIGH MEDIUM LOW; do
                count=$(jq --arg s "$sev" \
                  '[.Results[]?.Vulnerabilities[]? | select(.Severity == $s)] | length' \
                  trivy-results.json)
                echo "| $sev | $count |"
              done
            else
              echo "⚠️ Trivy did not produce a report - the scan failed to run, so this image has **not** been assessed."
            fi
            if [ -f trivy-sbom.cdx.json ]; then
              echo ""
              echo "A CycloneDX SBOM is attached to the Trivy scan artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push Docker image to GHCR
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/expense-tracker"
          VERSION_TAG="v${{ steps.meta.outputs.version }}"

          docker push "$IMAGE:${{ steps.meta.outputs.sha_short }}"

          # :vX.Y.Z must keep pointing at the image built from its release commit.
          # Every main build between releases still reports the last released version,
          # so only the first build of a version (the release merge commit) may create it.
          if out=$(docker manifest inspect "$IMAGE:$VERSION_TAG" 2>&1); then
            echo "$IMAGE:$VERSION_TAG already exists, leaving it unchanged"
          elif echo "$out" | grep -qiE 'manifest unknown|no such manifest|not found'; then
            docker push "$IMAGE:$VERSION_TAG"
          else
            # Auth/network errors must not be mistaken for "tag does not exist"
            echo "::error::Could not check whether $IMAGE:$VERSION_TAG exists: $out"
            exit 1
          fi
      
      - name: Prepare docker-compose for release
        run: |
          # Create a version-specific docker-compose file
          sed "s/{owner}/${{ github.repository_owner }}/g; s/:latest/:v${{ steps.meta.outputs.version }}/g" \
            docker-compose.ghcr.yml > docker-compose-v${{ steps.meta.outputs.version }}.yml
      
      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ steps.meta.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create or update release
        run: |
          VERSION="v${{ steps.meta.outputs.version }}"
          ASSET="docker-compose-v${{ steps.meta.outputs.version }}.yml"

          if [ "${{ steps.check_release.outputs.exists }}" = "true" ]; then
            echo "Release $VERSION already exists, uploading asset..."
            gh release upload "$VERSION" "$ASSET" --clobber
          else
            echo "Creating new release $VERSION..."
            {
              echo "## Pre-Built Container Image Available"
              echo ""
              echo "This release is available as a pre-built Docker image at GitHub Container Registry."
              echo ""
              echo "### Quick Start"
              echo ""
              echo "Download the docker-compose file:"
              echo "https://github.com/${{ github.repository }}/releases/download/$VERSION/$ASSET"
              echo ""
              echo "Then run: docker-compose -f $ASSET up -d"
              echo ""
              echo "### Container Images"
              echo ""
              echo "- ghcr.io/${{ github.repository_owner }}/expense-tracker:$VERSION (this release)"
              echo "- ghcr.io/${{ github.repository_owner }}/expense-tracker:${{ steps.meta.outputs.sha_short }} (commit SHA)"
              echo "- ghcr.io/${{ github.repository_owner }}/expense-tracker:latest (latest main)"
              echo ""
              echo "See CHANGELOG.md for detailed changes."
            } > release_notes.md

            # Handle race condition: deploy script may create the release between
            # the check and this step. If gh release create fails because the release
            # was created externally, fall back to uploading the asset.
            if ! gh release create "$VERSION" "$ASSET" \
              --title "Release $VERSION" \
              --notes-file release_notes.md 2>create_err.txt; then
              echo "gh release create failed, checking if release was created externally..."
              if gh release view "$VERSION" &>/dev/null; then
                echo "Release $VERSION now exists (created externally), uploading asset..."
                gh release upload "$VERSION" "$ASSET" --clobber
              else
                echo "::error::Failed to create release and release does not exist"
                cat create_err.txt
                exit 1
              fi
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-health-check:
    name: Deployment Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-push-ghcr]
    # Explicit result check: the implicit success() would also be false when a
    # test job further up the chain was skipped by the path filter.
    if: |
      !cancelled() &&
      needs.build-and-push-ghcr.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor != 'dependabot[bot]'
    permissions:
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: |
          {
            echo "sha_short=$(git rev-parse --short=7 HEAD)"
            echo "image=ghcr.io/${{ github.repository_owner }}/expense-tracker:$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Store previous deployment SHA
        id: previous
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          IMAGE_NAME="expense-tracker"
          CURRENT_SHA="${{ steps.meta.outputs.sha_short }}"

          # Pull :latest and extract the OCI revision label (previous commit SHA)
          PREVIOUS_SHA="none"
          if docker pull "$REGISTRY/$IMAGE_NAME:latest" 2>/dev/null; then
            PREV=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "$REGISTRY/$IMAGE_NAME:latest" 2>/dev/null || echo "")
            if [ -n "$PREV" ] && [ "$PREV" != "$CURRENT_SHA" ]; then
              PREVIOUS_SHA="$PREV"
              echo "Found previous deployment SHA: $PREVIOUS_SHA"
            else
              echo "Latest image has same SHA as current build ($CURRENT_SHA), no rollback target"
            fi
          else
            echo "No previous deployment found at :latest tag"
          fi

          {
            echo "previous_sha=$PREVIOUS_SHA"
            echo "registry=$REGISTRY"
            echo "image_name=$IMAGE_NAME"
            echo "Current SHA: $CURRENT_SHA"
            echo "Previous deployment SHA: $PREVIOUS_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Pull deployed Docker image
        run: docker pull "${{ steps.meta.outputs.image }}"

      - name: Start container
        id: start_container
        run: |
          CONFIG_DIR=$(mktemp -d)
          # Make writable by container's node user (UID 1000) without requiring root
          chmod -R 777 "$CONFIG_DIR"
          echo "config_dir=$CONFIG_DIR" >> "$GITHUB_OUTPUT"
          docker run -d \
            --name expense-tracker-health-check \
            -p 2424:2424 \
            -v "$CONFIG_DIR:/config" \
            -e NODE_ENV=production \
            -e LOG_LEVEL=info \
            "${{ steps.meta.outputs.image }}"

      - name: Make health check script executable
        run: chmod +x scripts/health-check.sh

      - name: Run backend health check
        id: backend_health
        run: |
          RETRIES=${{ inputs.health_check_retries || '10' }}
          TIMEOUT=${{ inputs.health_check_timeout || '30' }}
          ./scripts/health-check.sh http://localhost:2424/api/health "$RETRIES" 3 "$TIMEOUT"
        continue-on-error: true

      - name: Run frontend health check
        id: frontend_health
        run: |
          RETRIES=${{ inputs.health_check_retries || '10' }}
          TIMEOUT=${{ inputs.health_check_timeout || '30' }}
          ./scripts/health-check.sh http://localhost:2424/ "$RETRIES" 3 "$TIMEOUT"
        continue-on-error: true

      - name: Report health check results
        if: always()
        run: |
          {
            echo "## Deployment Health Check Results"
            echo ""
            echo "**Image:** \`${{ steps.meta.outputs.image }}\`"
            echo ""
            if [ "${{ steps.backend_health.outcome }}" = "success" ]; then
              echo "✅ Backend health check: **PASSED**"
            else
              echo "❌ Backend health check: **FAILED**"
            fi
            if [ "${{ steps.frontend_health.outcome }}" = "success" ]; then
              echo "✅ Frontend health check: **PASSED**"
            else
              echo "❌ Frontend health check: **FAILED**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect container logs on failure
        if: steps.backend_health.outcome == 'failure' || steps.frontend_health.outcome == 'failure'
        run: |
          echo "::group::Container logs"
          docker logs expense-tracker-health-check 2>&1 || true
          echo "::endgroup::"
          echo ""
          echo "::group::Container status"
          docker inspect expense-tracker-health-check --format='{{.State.Status}}' || true
          echo "::endgroup::"

      - name: Stop container
        if: always()
        run: |
          docker stop expense-tracker-health-check || true
          docker rm expense-tracker-health-check || true
          # Clean up temporary /config volume directory
          if [ -n "${{ steps.start_container.outputs.config_dir }}" ]; then
            rm -rf "${{ steps.start_container.outputs.config_dir }}" || true
          fi

      - name: Initiate rollback on health check failure
        id: rollback
        if: steps.backend_health.outcome == 'failure' || steps.frontend_health.outcome == 'failure'
        run: |
          ROLLBACK_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "::warning::[$ROLLBACK_TIMESTAMP] Health checks failed, initiating rollback"
          echo "  Failed SHA: ${{ steps.meta.outputs.sha_short }}"
          echo "  Previous SHA: ${{ steps.previous.outputs.previous_sha }}"
          echo "  Backend: ${{ steps.backend_health.outcome }}"
          echo "  Frontend: ${{ steps.frontend_health.outcome }}"

          if [ "${{ steps.previous.outputs.previous_sha }}" = "none" ]; then
            echo "::error::[$ROLLBACK_TIMESTAMP] No previous deployment available for rollback"
            echo "rollback_result=no_previous" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          chmod +x scripts/rollback.sh
          ROLLBACK_OUTPUT=$(./scripts/rollback.sh \
            "${{ steps.previous.outputs.previous_sha }}" \
            "${{ steps.previous.outputs.registry }}" \
            "${{ steps.previous.outputs.image_name }}" \
            "expense-tracker-health-check")
          echo "$ROLLBACK_OUTPUT"

          # Capture config_dir from rollback script output for cleanup
          ROLLBACK_CONFIG_DIR=$(echo "$ROLLBACK_OUTPUT" | grep '^config_dir=' | tail -1 | cut -d= -f2-)
          if [ -n "$ROLLBACK_CONFIG_DIR" ]; then
            echo "rollback_config_dir=$ROLLBACK_CONFIG_DIR" >> "$GITHUB_OUTPUT"
          fi

          echo "rollback_result=deployed" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Run health checks on rolled-back deployment
        id: rollback_health
        if: steps.rollback.outcome == 'success' && steps.rollback.outputs.rollback_result == 'deployed'
        run: |
          ROLLBACK_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "[$ROLLBACK_TIMESTAMP] Running health checks on rolled-back deployment..."

          chmod +x scripts/health-check.sh
          BACKEND_OK=true
          FRONTEND_OK=true

          ./scripts/health-check.sh http://localhost:2424/api/health 5 3 30 || BACKEND_OK=false
          ./scripts/health-check.sh http://localhost:2424/ 5 3 30 || FRONTEND_OK=false

          COMPLETION_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "$BACKEND_OK" = "true" ] && [ "$FRONTEND_OK" = "true" ]; then
            echo "[$COMPLETION_TIMESTAMP] ✓ Rollback health checks passed"
            echo "rollback_health=passed" >> "$GITHUB_OUTPUT"
          else
            echo "[$COMPLETION_TIMESTAMP] ✗ Rollback health checks failed"
            echo "  Backend: $BACKEND_OK, Frontend: $FRONTEND_OK"
            echo "rollback_health=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        continue-on-error: true

      - name: Report rollback results
        if: steps.rollback.outcome == 'success' || steps.rollback.outcome == 'failure'
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo ""
            echo "## Rollback Results"
            echo ""
            echo "**Trigger:** Health check failure for SHA \`${{ steps.meta.outputs.sha_short }}\`"
            echo "**Previous SHA:** \`${{ steps.previous.outputs.previous_sha }}\`"
            echo "**Timestamp:** $TIMESTAMP"
            echo ""

            if [ "${{ steps.rollback.outputs.rollback_result }}" = "no_previous" ]; then
              echo "❌ Rollback: **SKIPPED** (no previous deployment available)"
            elif [ "${{ steps.rollback_health.outputs.rollback_health }}" = "passed" ]; then
              echo "✅ Rollback: **SUCCESSFUL**"
              echo "✅ Rollback health checks: **PASSED**"
            else
              echo "❌ Rollback: **FAILED**"
              echo "⚠️ **Manual intervention required**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up rollback config directory
        if: always()
        run: |
          if [ -n "${{ steps.rollback.outputs.rollback_config_dir }}" ]; then
            rm -rf "${{ steps.rollback.outputs.rollback_config_dir }}" || true
          fi

      - name: Generate deployment metadata
        id: deployment_metadata
        if: always()
        run: |
          DEPLOY_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VERSION=$(jq -r .version backend/package.json)

          # Determine deployment status
          if [ "${{ steps.backend_health.outcome }}" = "success" ] && [ "${{ steps.frontend_health.outcome }}" = "success" ]; then
            DEPLOY_STATUS="success"
          elif [ "${{ steps.rollback_health.outputs.rollback_health }}" = "passed" ]; then
            DEPLOY_STATUS="rolled_back"
          else
            DEPLOY_STATUS="failed"
          fi

          # Determine health check results
          BACKEND_HEALTH="failed"
          FRONTEND_HEALTH="failed"
          [ "${{ steps.backend_health.outcome }}" = "success" ] && BACKEND_HEALTH="passed"
          [ "${{ steps.frontend_health.outcome }}" = "success" ] && FRONTEND_HEALTH="passed"

          # Build metadata JSON
          METADATA=$(cat <<EOF
          {
            "sha": "${{ steps.meta.outputs.sha_short }}",
            "timestamp": "$DEPLOY_TIMESTAMP",
            "environment": "production",
            "version": "$VERSION",
            "status": "$DEPLOY_STATUS",
            "healthChecks": {
              "backend": "$BACKEND_HEALTH",
              "frontend": "$FRONTEND_HEALTH"
            }
          }
          EOF
          )

          # Add rollback info if applicable
          if [ "$DEPLOY_STATUS" = "rolled_back" ]; then
            METADATA=$(echo "$METADATA" | jq --arg prevSha "${{ steps.previous.outputs.previous_sha }}" \
              --arg reason "Health check failure" \
              --arg ts "$DEPLOY_TIMESTAMP" \
              '. + { rollbackInfo: { previousSha: $prevSha, reason: $reason, timestamp: $ts } }')
          fi

          echo "$METADATA" > deployment-record.json
          echo "Deployment metadata generated:"
          cat deployment-record.json

          echo "deploy_status=$DEPLOY_STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload deployment record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-${{ steps.meta.outputs.sha_short }}
          path: deployment-record.json
          retention-days: 30

      - name: Report deployment state in summary
        if: always()
        run: |
          {
            echo ""
            echo "## Deployment State"
            echo ""
            echo "**Status:** \`${{ steps.deployment_metadata.outputs.deploy_status }}\`"
            if [ -f deployment-record.json ]; then
              echo '```json'
              cat deployment-record.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on health check failure
        if: steps.backend_health.outcome == 'failure' || steps.frontend_health.outcome == 'failure'
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "::error::[$TIMESTAMP] Deployment health checks failed for SHA ${{ steps.meta.outputs.sha_short }}"

          if [ "${{ steps.rollback_health.outputs.rollback_health }}" = "passed" ]; then
            echo "Rollback to ${{ steps.previous.outputs.previous_sha }} was successful"
          elif [ "${{ steps.rollback.outputs.rollback_result }}" = "no_previous" ]; then
            echo "::error::No previous deployment available for rollback - manual intervention required"
          else
            echo "::error::[$TIMESTAMP] Rollback also failed - manual intervention required"
            echo "::error::HALT: All automated recovery actions exhausted"
          fi
          exit 1
